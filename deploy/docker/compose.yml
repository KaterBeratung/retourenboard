name: retourenboard
services:
  database:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Run setup-docker.mjs first}
      RETOURENBOARD_DATABASE_PASSWORD: ${POSTGRES_APP_PASSWORD:?Run setup-docker.mjs first}
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./postgres-init.sh:/docker-entrypoint-initdb.d/10-retourenboard.sh:ro
    healthcheck:
      test: [CMD-SHELL, pg_isready -U postgres -d postgres]
      interval: 5s
      timeout: 3s
      retries: 12
  retourenboard: &application
    # Build this package locally; no published registry tag is required.
    image: retourenboard:local
    build:
      context: ../..
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      database:
        condition: service_healthy
    environment: &application-environment
      HOST: 0.0.0.0
      PORT: 3000
      DATA_DIR: /data
      DATABASE_URL: ${DATABASE_URL:?Run setup-docker.mjs first}
      NODE_ENV: "${RB_NODE_ENV:-development}"
      SECURE_COOKIES: "${RB_SECURE_COOKIES:-false}"
      PUBLIC_ORIGIN: "${RB_PUBLIC_ORIGIN:-}"
      TRUSTED_PROXIES: "${RB_TRUSTED_PROXIES:-}"
    ports:
      - "${RB_BIND_IP:-127.0.0.1}:${RETOURENBOARD_HTTP_PORT:-${RB_PORT:-3000}}:3000"
    volumes:
      - retourenboard-data:/data
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/health').then(r=>r.json()).then(h=>process.exit(h.ok&&h.databaseEngine==='postgresql'?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
  migrate:
    <<: *application
    profiles: [migration]
    restart: "no"
    ports: []
    healthcheck:
      disable: true
    volumes:
      - retourenboard-data:/data
      - legacy-data:/legacy:ro
    entrypoint: [node, scripts/migrate-sqlite.mjs]
    command: [--check, --data-dir, /data, --source-data, /legacy, --sqlite, /legacy/retouren.sqlite]
volumes:
  # PostgreSQL18 uses a versioned PGDATA directory beneath this volume root.
  postgres-data:
  retourenboard-data:
    name: ${RETOURENBOARD_DATA_VOLUME:-retourenboard-data}
  legacy-data:
    external: true
    name: ${RETOURENBOARD_LEGACY_DATA_VOLUME:-retourenboard-legacy-data}
